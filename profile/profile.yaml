# List of personal or academic projects
# Feel free to add more projects
highlighted_projects:
  - name: "Virtual Reality Impact Analysis on Student Engagement"
    git_url: ""
    description: "Built an end-to-end analytics and ML workflow to evaluate how virtual reality (VR) adoption influences student engagement and collaboration. Cleaned and transformed survey/learning datasets in Python, performed exploratory analysis, and designed interactive Tableau dashboards to communicate key trends. Trained an XGBoost classifier to predict learning outcome improvement, engineered features (e.g., engagement ratio), and evaluated results using precision, accuracy, and confusion matrices to recommend targeted VR deployment strategies."

  - name: "Analysis of Student Perception of Professors"
    git_url: ""
    description: "Developed an NLP-driven analytics pipeline to analyze over 5,000 student reviews and extract insights into professor performance and teaching effectiveness. Cleaned and processed unstructured text data, applied sentiment analysis using VADER, and clustered professors based on feedback patterns using Scikit-learn. Integrated OpenAI APIs to extract nuanced character traits from comments and built interactive Power BI dashboards (served via Flask) to deliver clear, actionable insights for academic decision-making."

  - name: "Human vs LLM Text Classification"
    git_url: ""
    description: "Designed and evaluated machine learning models to distinguish between human-written and AI-generated text at scale. Performed extensive text preprocessing and feature engineering using TF-IDF and Word2Vec embeddings, applied dimensionality reduction with PCA, and trained binary and multi-class classifiers. Achieved strong classification performance using Random Forest and MLP models, validated results with cross-validation and confusion matrices, and optimized models for scalability through hyperparameter tuning and model serialization."

